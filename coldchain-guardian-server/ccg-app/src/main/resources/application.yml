server:
  port: 8080

spring:
  application:
    name: coldchain-guardian-server

  datasource:
    url: jdbc:mysql://localhost:3306/coldchain_guardian?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: G200410115812
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 47.104.195.63
      port: 6379
      password: G200410115812
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  main:
    allow-bean-definition-overriding: true

# JWT配置
jwt:
  secret: ${JWT_SECRET:coldChainGuardianSecretKeyForJwtToken_ChangeMe_32bytes}
  expiration: 86400  # 秒

# 日志配置
logging:
  level:
    com.coldchain.guardian: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
