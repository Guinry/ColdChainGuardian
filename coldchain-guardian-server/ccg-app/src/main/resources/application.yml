server:
  port: 8080
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: coldchain-guardian-server

  datasource:
    url: jdbc:mysql://localhost:3306/coldchain_guardian?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: G200410115812
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 47.104.195.63
      port: 6379
      password: G200410115812
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  main:
    allow-bean-definition-overriding: true

  mvc:
    async:
      # 设置异步请求超时时间为 5 分钟 (300000 毫秒)，或者直接设为 -1 (永不超时)
      request-timeout: 300000

# 微信小程序配置
wx:
  miniprogram:
    appid: ${WX_APP_ID:wx839593338a0174f1}  # 微信小程序AppID
    secret: ${WX_APP_SECRET:f5b225c35dc53ad736984cad0641b03f}  # 微信小程序AppSecret
    allow-devtools-login: ${WX_ALLOW_DEVTOOLS_LOGIN:true} # PC 模拟器/微信开发者工具允许按手机号开发登录
    request-timeout: 5000  # 请求超时时间（毫秒）

ccg:
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:not-configured}}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://www.openclaudecode.cn}
      model: ${SPRING_AI_OPENAI_CHAT_MODEL:deepseek-v4-pro}
      protocol: ${SPRING_AI_OPENAI_PROTOCOL:chat-completions}
      user-agent: ${SPRING_AI_OPENAI_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:149.0) Gecko/20100101 Firefox/149.0}
      timeout-seconds: ${SPRING_AI_OPENAI_TIMEOUT_SECONDS:90}
      max-output-tokens: ${SPRING_AI_OPENAI_MAX_OUTPUT_TOKENS:4096}

# JWT配置
jwt:
  secret: ${JWT_SECRET:coldChainGuardianSecretKeyForJwtToken_ChangeMe_32bytes}
  expiration: 86400  # 秒

# 日志配置
logging:
  level:
    com.coldchain.guardian: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
