# 微信小程序配置
wx:
  miniprogram:
    appid: ${WX_APP_ID:wx839593338a0174f1}  # 微信小程序AppID
    secret: ${WX_APP_SECRET:y5fed12030ee5c4291ed735ee858dbbbd}  # 微信小程序AppSecret
    request-timeout: 5000  # 请求超时时间（毫秒）

# JWT配置
jwt:
  secret: ${JWT_SECRET:coldChainGuardianSecretKeyForJwtToken_ChangeMe_32bytes}
  expiration: 86400  # 秒

# 日志配置
logging:
  level:
    com.coldchain.guardian: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
