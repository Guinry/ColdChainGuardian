server:
  port: 8080

spring:
  application:
    name: coldchain-guardian-server
  datasource:
    url: jdbc:mysql://localhost:3306/coldchain_guardian?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: localhost
    port: 6379

# JWT配置
jwt:
  secret: coldChainGuardianSecretKeyForJwtToken  # 生产环境应该使用更强的密钥并从环境变量读取
  expiration: 86400  # 24小时过期（秒）

# 日志配置
logging:
  level:
    com.coldchain.guardian: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0